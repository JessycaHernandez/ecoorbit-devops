services:
  api:
    container_name: ecoorbit-api-prod
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: mongodb://mongo:27017/ecoOrbit_prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  mongo:
    container_name: ecoorbit-mongo-prod
    environment:
      MONGO_INITDB_DATABASE: ecoOrbit_prod
    volumes:
      - mongo-data-prod:/data/db
    restart: always

volumes:
  mongo-data-prod:
