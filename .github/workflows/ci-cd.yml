name: CI/CD - EcoOrbit API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ecoorbit-api

jobs:
  build-and-test:
    name: Build & Testes automatizados
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build (mvn compile)
        run: mvn -B clean compile

      - name: Testes automatizados (mvn test)
        env:
          MONGODB_URI: mongodb://localhost:27017/ecoOrbit_ci
        run: mvn -B test

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/

      - name: Empacotar aplicação (jar)
        run: mvn -B package -DskipTests

      - name: Upload do artefato (jar)
        uses: actions/upload-artifact@v4
        with:
          name: ecoorbit-api-jar
          path: target/ecoorbit-api.jar

  docker-build-push:
    name: Build & Push da imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Definir nome da imagem
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

  deploy-staging:
    name: Deploy em Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment:
      name: staging
      url: http://localhost:8081/api/status
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir stack de staging (api + mongo)
        env:
          TAG: ${{ needs.docker-build-push.outputs.image_tag }}
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build

      - name: Aguardar a API responder
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8081/api/status; then
              echo "API de staging no ar!"
              exit 0
            fi
            echo "Aguardando API subir... ($i/15)"
            sleep 5
          done
          echo "API de staging não respondeu a tempo" >&2
          docker compose -f docker-compose.yml -f docker-compose.staging.yml logs
          exit 1

      - name: Smoke test (evidência do deploy)
        run: curl -s http://localhost:8081/api/status | tee staging-smoke-test.json

      - name: Guardar evidência do deploy em staging
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-deploy-staging
          path: staging-smoke-test.json

      - name: Encerrar stack de staging
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml down -v

  deploy-production:
    name: Deploy em Produção
    runs-on: ubuntu-latest
    needs: [docker-build-push, deploy-staging]
    environment:
      name: production
      url: http://localhost:8080/api/status
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir stack de produção (api + mongo)
        env:
          TAG: ${{ needs.docker-build-push.outputs.image_tag }}
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

      - name: Aguardar a API responder
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/api/status; then
              echo "API de produção no ar!"
              exit 0
            fi
            echo "Aguardando API subir... ($i/15)"
            sleep 5
          done
          echo "API de produção não respondeu a tempo" >&2
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs
          exit 1

      - name: Smoke test (evidência do deploy)
        run: curl -s http://localhost:8080/api/status | tee production-smoke-test.json

      - name: Guardar evidência do deploy em produção
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-deploy-producao
          path: production-smoke-test.json

      - name: Encerrar stack de produção
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
