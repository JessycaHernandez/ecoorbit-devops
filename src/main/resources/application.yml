spring:
  application:
    name: ecoorbit-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ecoOrbit}

app:
  environment: ${APP_ENV:local}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
